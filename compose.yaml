services:
  api:
    build: ./backend
    container_name: rapidfinil-api
    env_file:
      - ./backend/.env
    # Resolve external hosts (e.g. a hosted BTCPay Server) directly via public
    # DNS. The Docker default forwards to the host resolver, which on this box
    # (systemd-resolved -> LAN router) intermittently fails to resolve public
    # names — httpx then raises "Temporary failure in name resolution".
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      # Admin-uploaded product photos (see app/services/uploads.py) — without
      # this they'd live only in the container's writable layer and vanish
      # on the next `docker compose up --build`/recreate.
      - uploads_data:/app/uploads
    restart: unless-stopped

  worker:
    build: ./backend
    container_name: rapidfinil-worker
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=info"]
    env_file:
      - ./backend/.env
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:18
    container_name: rapidfinil-postgres
    env_file:
      - ./backend/.env
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    container_name: rapidfinil-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: rapidfinil-nginx
    volumes:
      - ./backend/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  uploads_data:
