name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: rapidfinil_test
          POSTGRES_USER: rapidfinil
          POSTGRES_PASSWORD: rapidfinil
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rapidfinil -d rapidfinil_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://rapidfinil:rapidfinil@localhost:5432/rapidfinil_test
      REDIS_URL: redis://localhost:6379/0
      ADMIN_API_KEY: ci-test-admin-key

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Run Alembic migrations
        run: alembic upgrade head

      - name: Seed catalog (smoke test)
        run: python -m app.seed.seed_catalog

      - name: Run tests
        run: pytest -q

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t rapidfinil-backend:ci backend
